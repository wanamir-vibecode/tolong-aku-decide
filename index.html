<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tolong Aku Decide</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Typography Tokens -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Slackey&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-display: 'Slackey', cursive;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background-color: #0f0f11;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .font-slackey {
      font-family: var(--font-display);
    }

    /* Spring kinetic animations */
    @keyframes pulsePop {
      0% { transform: scale(0.92); opacity: 0; }
      70% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-pop {
      animation: pulsePop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Word-break protection for display type */
    .balanced-wrap {
      overflow-wrap: break-word;
      word-break: normal;
      hyphens: none;
    }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col justify-between overflow-x-hidden antialiased">

  <!-- Mobile Viewport Container -->
  <div id="viewportRoot" class="w-full max-w-md mx-auto min-h-[100dvh] flex flex-col justify-between px-5 py-6 transition-colors duration-500 relative">
    
    <!-- HOME DASHBOARD VIEW -->
    <main id="mainDashboard" class="flex flex-col flex-1 justify-between w-full transition-opacity duration-300">
      
      <!-- Top Utility Header -->
      <header class="w-full flex items-center justify-between pt-1">
        <button id="historyTriggerBtn" class="h-9 px-4 rounded-full bg-[#1b1b1f] border border-zinc-800 text-xs font-bold text-zinc-300 flex items-center gap-2 active:scale-95 transition-transform">
          <span class="w-2 h-2 rounded-full bg-[#ffd02f]"></span>
          <span>History (<span id="historyCount">0</span>)</span>
        </button>
      </header>

      <!-- Center Content Cluster -->
      <section class="flex flex-col items-center text-center my-auto w-full py-4">
        
        <!-- Display Branding Block -->
        <div class="mb-8">
          <h1 class="font-slackey text-[2.65rem] sm:text-[3.25rem] text-white tracking-normal leading-[1.08] drop-shadow-sm">
            TOLONG<br />
            <span class="text-[#ffd02f]">AKU DECIDE</span>
          </h1>
          <p class="mt-3 text-sm sm:text-[15px] font-medium text-zinc-400 max-w-[320px] mx-auto leading-relaxed">
            Jangan gaduh. Meh aku tolong pilih.
          </p>
        </div>

        <!-- Pill Input Form -->
        <form id="optionForm" class="w-full relative mb-6">
          <div class="relative flex items-center w-full h-14 rounded-full bg-[#1b1b1f] border border-zinc-800 px-2 pl-5 focus-within:border-zinc-600 transition-colors">
            <input 
              id="optionInput"
              type="text" 
              autocomplete="off"
              placeholder="Add option / choice..."
              class="w-full bg-transparent text-sm sm:text-base font-semibold text-white placeholder-zinc-500 focus:outline-none pr-3"
            />
            <button 
              type="submit" 
              class="h-10 px-5 rounded-full bg-zinc-800 text-xs font-extrabold text-white uppercase tracking-wider hover:bg-zinc-700 active:scale-95 transition-transform"
            >
              Add
            </button>
          </div>
        </form>

        <!-- Dynamic Color Options Stack -->
        <div id="optionsContainer" class="w-full flex flex-col gap-2.5 max-h-[36vh] overflow-y-auto pr-1">
          <!-- Injected via JavaScript -->
        </div>

      </section>

      <!-- Bottom Spin CTA -->
      <footer class="w-full pt-4 pb-2">
        <button 
          id="spinTriggerBtn" 
          disabled
          class="h-14 w-full rounded-full bg-[#ffd02f] disabled:bg-zinc-800 disabled:text-zinc-600 text-black font-extrabold text-lg tracking-wide uppercase shadow-lg active:scale-[0.98] transition-all"
        >
          Spin Wheel
        </button>
      </footer>

    </main>

    <!-- KINETIC TICKER / ROULETTE OVERLAY -->
    <div id="tickerView" class="hidden fixed inset-0 z-30 flex flex-col items-center justify-center bg-[#0f0f11] px-6">
      <div class="w-full max-w-sm flex flex-col items-center text-center">
        <span class="text-xs font-extrabold tracking-widest text-zinc-500 uppercase mb-4">Rolling Choices</span>
        <div id="tickerBox" class="w-full h-24 rounded-full flex items-center justify-center px-6 transition-colors shadow-2xl">
          <span id="tickerText" class="font-slackey text-2xl sm:text-3xl text-black balanced-wrap leading-tight"></span>
        </div>
      </div>
    </div>

    <!-- WINNER & NEGOTIATION VIEW -->
    <section id="resultView" class="hidden fixed inset-0 z-40 flex flex-col justify-between p-6 max-w-md mx-auto">
      
      <!-- Announcement Eyebrow -->
      <header class="w-full text-center pt-8">
        <span class="inline-block px-4 py-1.5 rounded-full bg-black text-white text-xs font-extrabold tracking-wider uppercase shadow-md">
          Yang menang adalah...
        </span>
      </header>

      <!-- Winning Choice Reveal -->
      <div class="flex flex-col items-center justify-center text-center px-4 my-auto">
        <h2 id="winnerText" class="font-slackey text-4xl sm:text-5xl text-black balanced-wrap leading-tight mb-3"></h2>
        <p id="winnerSubhead" class="text-base font-bold text-black/80">Happy with this choice?</p>
      </div>

      <!-- Negotiation Buttons Stack -->
      <footer class="w-full flex flex-col gap-3 pb-6">
        
        <!-- Primary Confirmation -->
        <div id="initialActions" class="grid grid-cols-2 gap-3">
          <button id="acceptBtn" class="h-14 rounded-full bg-black text-white font-extrabold text-base uppercase active:scale-95 transition-transform shadow-lg">
            Yes
          </button>
          <button id="rejectBtn" class="h-14 rounded-full bg-black/10 border-2 border-black/20 text-black font-extrabold text-base uppercase active:scale-95 transition-transform">
            No
          </button>
        </div>

        <!-- Rejection Negotiation -->
        <div id="negotiationActions" class="hidden grid-cols-2 gap-3">
          <button id="reSpinBtn" class="h-14 rounded-full bg-black text-white font-extrabold text-sm uppercase active:scale-95 transition-transform shadow-lg">
            Choose Another
          </button>
          <button id="doAnywaysBtn" class="h-14 rounded-full bg-white text-black font-extrabold text-sm uppercase active:scale-95 transition-transform shadow-lg">
            Do Anyways
          </button>
        </div>

        <!-- Celebration Close -->
        <div id="celebrationActions" class="hidden flex-col gap-2">
          <div class="w-full text-center py-2">
            <span class="font-slackey text-2xl text-black">Congrats Doh!</span>
          </div>
          <button id="finishBtn" class="h-14 w-full rounded-full bg-black text-white font-extrabold text-base uppercase active:scale-95 transition-transform shadow-lg">
            Done
          </button>
        </div>

      </footer>

    </section>

    <!-- DECISION HISTORY MODAL -->
    <div id="historyView" class="hidden fixed inset-0 z-50 bg-[#0f0f11] flex flex-col max-w-md mx-auto p-6 justify-between">
      <header class="w-full flex items-center justify-between border-b border-zinc-800 pb-4">
        <h2 class="font-slackey text-xl text-[#ffd02f]">Decision History</h2>
        <button id="closeHistoryBtn" class="h-8 px-4 rounded-full bg-zinc-800 text-xs font-bold text-zinc-300 active:scale-95">
          Close
        </button>
      </header>

      <div id="historyList" class="flex flex-col gap-3 overflow-y-auto my-6 flex-1 pr-1">
        <!-- Injected via JavaScript -->
      </div>

      <footer class="w-full pt-2">
        <button id="clearHistoryBtn" class="w-full h-12 rounded-full border border-zinc-800 text-xs font-bold text-zinc-500 hover:text-red-400 active:scale-95 transition-colors">
          Clear History
        </button>
      </footer>
    </div>

  </div>

  <script>
    // State Store
    let options = [];
    let history = [];
    let currentWinner = null;
    let audioCtx = null;

    // Design System Color Tokens (6 Vibrant Accents)
    const ACCENT_COLORS = [
      '#ff6b6b', // Coral Punch
      '#4ecdc4', // Bright Teal
      '#ffe66d', // Lemon Pop
      '#a8e6cf', // Mint Leaf
      '#ff8b94', // Rose Dust
      '#c7ecee'  // Soft Sky
    ];

    // DOM Elements
    const viewportRoot = document.getElementById('viewportRoot');
    const mainDashboard = document.getElementById('mainDashboard');
    const optionForm = document.getElementById('optionForm');
    const optionInput = document.getElementById('optionInput');
    const optionsContainer = document.getElementById('optionsContainer');
    const spinTriggerBtn = document.getElementById('spinTriggerBtn');
    const tickerView = document.getElementById('tickerView');
    const tickerBox = document.getElementById('tickerBox');
    const tickerText = document.getElementById('tickerText');
    const resultView = document.getElementById('resultView');
    const winnerText = document.getElementById('winnerText');
    const winnerSubhead = document.getElementById('winnerSubhead');
    const initialActions = document.getElementById('initialActions');
    const negotiationActions = document.getElementById('negotiationActions');
    const celebrationActions = document.getElementById('celebrationActions');
    const acceptBtn = document.getElementById('acceptBtn');
    const rejectBtn = document.getElementById('rejectBtn');
    const reSpinBtn = document.getElementById('reSpinBtn');
    const doAnywaysBtn = document.getElementById('doAnywaysBtn');
    const finishBtn = document.getElementById('finishBtn');
    const historyTriggerBtn = document.getElementById('historyTriggerBtn');
    const historyCount = document.getElementById('historyCount');
    const historyView = document.getElementById('historyView');
    const historyList = document.getElementById('historyList');
    const closeHistoryBtn = document.getElementById('closeHistoryBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    // Web Audio Synthesiser
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTick() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {}
    }

    function playVictory() {
      try {
        initAudio();
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.09);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.09 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + idx * 0.09);
          osc.stop(audioCtx.currentTime + idx * 0.09 + 0.35);
        });
      } catch (e) {}
    }

    // Render Options List
    function renderOptions() {
      optionsContainer.innerHTML = '';
      options.forEach((opt, index) => {
        const item = document.createElement('div');
        item.className = 'w-full h-12 rounded-full px-4 flex items-center justify-between animate-pop';
        item.style.backgroundColor = opt.color;
        item.innerHTML = `
          <span class="text-sm font-bold text-black truncate pr-3">${opt.name}</span>
          <button type="button" data-index="${index}" class="remove-opt-btn w-7 h-7 rounded-full bg-black/10 flex items-center justify-center text-black font-bold text-xs hover:bg-black/20 active:scale-90 transition-transform">
            ✕
          </button>
        `;
        optionsContainer.appendChild(item);
      });

      // Update CTA State
      spinTriggerBtn.disabled = options.length < 2;
      if (options.length < 2) {
        spinTriggerBtn.innerText = options.length === 0 ? 'Add Choices First' : 'Add 1 More Choice';
      } else {
        spinTriggerBtn.innerText = 'Spin Wheel';
      }

      // Bind dynamic remove buttons
      document.querySelectorAll('.remove-opt-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.getAttribute('data-index'), 10);
          options.splice(idx, 1);
          renderOptions();
        };
      });
    }

    // Add New Option
    optionForm.onsubmit = (e) => {
      e.preventDefault();
      const val = optionInput.value.trim();
      if (!val) return;

      const color = ACCENT_COLORS[options.length % ACCENT_COLORS.length];
      options.push({ name: val, color: color });
      optionInput.value = '';
      renderOptions();
    };

    // Kinetic Roulette Physics Engine
    spinTriggerBtn.onclick = () => {
      if (options.length < 2) return;
      initAudio();

      // UI Stage Shift
      mainDashboard.classList.add('opacity-0', 'pointer-events-none');
      tickerView.classList.remove('hidden');

      let currentInterval = 45;
      let iterations = 0;
      const minIterations = 28;
      const totalDecelerationSteps = 16;
      let step = 0;

      function runTick() {
        iterations++;
        const candidate = options[Math.floor(Math.random() * options.length)];
        
        tickerText.innerText = candidate.name;
        tickerBox.style.backgroundColor = candidate.color;
        playTick();

        if (iterations < minIterations) {
          // Constant velocity
          setTimeout(runTick, currentInterval);
        } else if (step < totalDecelerationSteps) {
          // Kinetic variable-friction deceleration curve
          step++;
          currentInterval += Math.floor(Math.pow(step, 1.45) * 4.5);
          setTimeout(runTick, currentInterval);
        } else {
          // Spin complete
          currentWinner = candidate;
          setTimeout(revealWinner, 350);
        }
      }

      runTick();
    };

    // Reveal Winner & Flood Viewport
    function revealWinner() {
      tickerView.classList.add('hidden');
      
      // Dynamic Color Flood
      viewportRoot.style.backgroundColor = currentWinner.color;
      document.body.style.backgroundColor = currentWinner.color;

      winnerText.innerText = currentWinner.name;
      winnerSubhead.innerText = 'Happy with this choice?';
      
      initialActions.classList.remove('hidden');
      negotiationActions.classList.add('hidden');
      celebrationActions.classList.add('hidden');
      
      resultView.classList.remove('hidden');
      playVictory();
    }

    // Negotiation Logic
    acceptBtn.onclick = () => {
      saveToHistory(currentWinner.name);
      initialActions.classList.add('hidden');
      celebrationActions.classList.remove('hidden');
    };

    rejectBtn.onclick = () => {
      initialActions.classList.add('hidden');
      negotiationActions.classList.remove('hidden');
      negotiationActions.classList.add('grid');
    };

    reSpinBtn.onclick = () => {
      // Filter out rejected choice and re-spin
      options = options.filter(o => o.name !== currentWinner.name);
      resetToDashboard();
      renderOptions();
      if (options.length >= 2) {
        spinTriggerBtn.click();
      }
    };

    doAnywaysBtn.onclick = () => {
      saveToHistory(currentWinner.name);
      negotiationActions.classList.add('hidden');
      celebrationActions.classList.remove('hidden');
    };

    finishBtn.onclick = () => {
      resetToDashboard();
      options = [];
      renderOptions();
    };

    function resetToDashboard() {
      viewportRoot.style.backgroundColor = '#0f0f11';
      document.body.style.backgroundColor = '#0f0f11';
      resultView.classList.add('hidden');
      mainDashboard.classList.remove('opacity-0', 'pointer-events-none');
    }

    // History Tracking
    function saveToHistory(winnerName) {
      const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      history.unshift({ name: winnerName, time: timestamp });
      historyCount.innerText = history.length;
    }

    historyTriggerBtn.onclick = () => {
      renderHistory();
      historyView.classList.remove('hidden');
    };

    closeHistoryBtn.onclick = () => {
      historyView.classList.add('hidden');
    };

    clearHistoryBtn.onclick = () => {
      history = [];
      historyCount.innerText = '0';
      renderHistory();
    };

    function renderHistory() {
      historyList.innerHTML = '';
      if (history.length === 0) {
        historyList.innerHTML = '<div class="text-center text-xs text-zinc-600 my-auto">No prior decisions recorded yet.</div>';
        return;
      }
      history.forEach(item => {
        const row = document.createElement('div');
        row.className = 'w-full h-12 rounded-full px-5 bg-[#1b1b1f] border border-zinc-800 flex items-center justify-between';
        row.innerHTML = `
          <span class="text-sm font-bold text-white truncate pr-2">${item.name}</span>
          <span class="text-xs font-semibold text-zinc-500">${item.time}</span>
        `;
        historyList.appendChild(row);
      });
    }

    // Initial render
    renderOptions();
  </script>
</body>
</html>
